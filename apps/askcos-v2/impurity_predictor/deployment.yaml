docker:
  cpu:
    image: ${ASKCOS_REGISTRY}/impurity_predictor:1.0-cpu
    build: docker build -f Dockerfile_impurity_cpu -t ${ASKCOS_REGISTRY}/impurity_predictor:1.0-cpu .
    start: sh scripts/serve_cpu_in_docker.sh

singularity:
  cpu:
    image: impurity_cpu.sif
    build: singularity build -f impurity_cpu.sif singularity_impurity_cpu.def
    start: sh scripts/serve_cpu_in_singularity.sh

commands:
  stop-docker: docker stop impurity_predictor; docker rm impurity_predictor
  stop-singularity: singularity instance stop impurity_predictor
