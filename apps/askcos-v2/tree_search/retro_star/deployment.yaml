docker:
  cpu:
    image: ${ASKCOS_REGISTRY}/tree_search/retro_star:1.0-cpu
    build: docker build -f Dockerfile_cpu -t ${ASKCOS_REGISTRY}/tree_search/retro_star:1.0-cpu .
    start: sh scripts/serve_cpu_in_docker.sh

singularity:
  cpu:
    image: retro_star_cpu.sif
    build: singularity build -f retro_star_cpu.sif singularity_cpu.def
    start: sh scripts/serve_cpu_in_singularity.sh

commands:
  stop-docker: docker stop retro_star; docker rm retro_star
  stop-singularity: singularity instance stop retro_star
