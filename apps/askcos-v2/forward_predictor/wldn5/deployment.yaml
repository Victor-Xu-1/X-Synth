docker:
  cpu:
    image: ${ASKCOS_REGISTRY}/forward_predictor/wldn5:1.0-cpu
    build: docker build -f Dockerfile_cpu -t ${ASKCOS_REGISTRY}/forward_predictor/wldn5:1.0-cpu .
    start: sh scripts/serve_cpu_in_docker.sh
  gpu:
    image: ${ASKCOS_REGISTRY}/forward_predictor/wldn5:1.0-gpu
    build: docker build -f Dockerfile_gpu -t ${ASKCOS_REGISTRY}/forward_predictor/wldn5:1.0-gpu .
    start: sh scripts/serve_gpu_in_docker.sh

singularity:
  cpu:
    image: forward_wldn5_cpu.sif
    build: singularity build -f forward_wldn5_cpu.sif singularity_cpu.def
    start: sh scripts/serve_cpu_in_singularity.sh
  gpu:
    image: forward_wldn5_gpu.sif
    build: singularity build -f forward_wldn5_gpu.sif singularity_gpu.def
    start: sh scripts/serve_gpu_in_singularity.sh

commands:
  stop-docker: docker stop forward_wldn5; docker rm forward_wldn5
  stop-singularity: singularity instance stop forward_wldn5
