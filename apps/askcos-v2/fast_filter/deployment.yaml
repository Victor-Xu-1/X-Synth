docker:
  cpu:
    image: ${ASKCOS_REGISTRY}/fast_filter:1.0-cpu
    build: docker build -f Dockerfile_ff_cpu -t ${ASKCOS_REGISTRY}/fast_filter:1.0-cpu .
    start: sh scripts/serve_cpu_in_docker.sh
  gpu:
    image: ${ASKCOS_REGISTRY}/fast_filter:1.0-gpu
    build: docker build -f Dockerfile_ff_gpu -t ${ASKCOS_REGISTRY}/fast_filter:1.0-gpu .
    start: sh scripts/serve_gpu_in_docker.sh

singularity:
  cpu:
    image: fast_filter_cpu.sif
    build: singularity build -f fast_filter_cpu.sif fast_filter_cpu.def
    start: sh scripts/serve_cpu_in_singularity.sh
  gpu:
    image: fast_filter_gpu.sif
    build: singularity build -f fast_filter_gpu.sif fast_filter_gpu.def
    start: sh scripts/serve_gpu_in_singularity.sh

commands:
  stop-docker: docker stop fast_filter; docker rm fast_filter
  stop-singularity: singularity instance stop fast_filter
