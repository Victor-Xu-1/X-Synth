docker:
  cpu:
    image: ${ASKCOS_REGISTRY}/cluster:1.0-cpu
    build: docker build -f Dockerfile_cpu -t ${ASKCOS_REGISTRY}/cluster:1.0-cpu .
    start: sh scripts/serve_cpu_in_docker.sh

singularity:
  cpu:
    image: cluster_cpu.sif
    build: singularity build -f cluster_cpu.sif singularity_cpu.def
    start: sh scripts/serve_cpu_in_singularity.sh

commands:
  stop-docker: docker stop cluster; docker rm cluster
  stop-singularity: singularity instance stop cluster
