docker:
  cpu:
    image: ${ASKCOS_REGISTRY}/fastsolv:1.0-cpu
    build: docker build -f Dockerfile_fastsolv_cpu -t ${ASKCOS_REGISTRY}/fastsolv:1.0-cpu .
    start: sh scripts/serve_cpu_in_docker.sh
  gpu:
    image: ${ASKCOS_REGISTRY}/fastsolv:1.0-gpu
    build: docker build -f Dockerfile_fastsolv_gpu -t ${ASKCOS_REGISTRY}/fastsolv:1.0-gpu .
    start: sh scripts/serve_gpu_in_docker.sh

singularity:
  cpu:
    image: fastsolv_cpu.sif
    build: singularity build -f fastsolv_cpu.sif fastsolv_cpu.def
    start: sh scripts/serve_cpu_in_singularity.sh
  gpu:
    image: fastsolv_gpu.sif
    build: singularity build -f fastsolv_gpu.sif fastsolv_gpu.def
    start: sh scripts/serve_gpu_in_singularity.sh

commands:
  download:
  stop-docker: docker stop fastsolv; docker rm fastsolv
  stop-singularity: singularity instance stop fastsolv
