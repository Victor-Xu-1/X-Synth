docker:
  cpu:
    image: ${ASKCOS_REGISTRY}/site_selectivity:1.0-cpu
    build: docker build -f Dockerfile_site_cpu -t ${ASKCOS_REGISTRY}/site_selectivity:1.0-cpu .
    start: sh scripts/serve_cpu_in_docker.sh
  gpu:
    image: ${ASKCOS_REGISTRY}/site_selectivity:1.0-gpu
    build: docker build -f Dockerfile_site_gpu -t ${ASKCOS_REGISTRY}/site_selectivity:1.0-gpu .
    start: sh scripts/serve_gpu_in_docker.sh

singularity:
  cpu:
    image: site_selectivity_cpu.sif
    build: singularity build -f site_selectivity_cpu.sif site_selectivity_cpu.def
    start: sh scripts/serve_cpu_in_singularity.sh
  gpu:
    image: site_selectivity_gpu.sif
    build: singularity build -f site_selectivity_gpu.sif site_selectivity_gpu.def
    start: sh scripts/serve_gpu_in_singularity.sh

commands:
  stop-docker: docker stop site_selectivity; docker rm site_selectivity
  stop-singularity: singularity instance stop site_selectivity
