docker:
  cpu:
    image: ${ASKCOS_REGISTRY}/count_analogs:1.0-cpu
    build: docker build -f Dockerfile_ca_cpu -t ${ASKCOS_REGISTRY}/count_analogs:1.0-cpu .
    start: sh scripts/serve_cpu_in_docker.sh

singularity:
  cpu:
    image: count_analogs_cpu.sif
    build: singularity build -f count_analogs_cpu.sif singularity_ca_cpu.def
    start: sh scripts/serve_cpu_in_singularity.sh

commands:
  stop-docker: docker stop count_analogs; docker rm count_analogs
  stop-singularity: singularity instance stop count_analogs
