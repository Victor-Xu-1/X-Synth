docker:
  cpu:
    image: ${ASKCOS_REGISTRY}/qm_descriptors:1.0-cpu
    build: docker build -f Dockerfile_qm_des_cpu -t ${ASKCOS_REGISTRY}/qm_descriptors:1.0-cpu .
    start: sh scripts/serve_cpu_in_docker.sh
  gpu:
    image: ${ASKCOS_REGISTRY}/qm_descriptors:1.0-gpu
    build: docker build -f Dockerfile_qm_des_gpu -t ${ASKCOS_REGISTRY}/qm_descriptors:1.0-gpu .
    start: sh scripts/serve_gpu_in_docker.sh

singularity:
  cpu:
    image: qm_descriptors_cpu.sif
    build: singularity build -f qm_descriptors_cpu.sif qm_descriptors_cpu.def
    start: sh scripts/serve_cpu_in_singularity.sh
  gpu:
    image: qm_descriptors_gpu.sif
    build: singularity build -f qm_descriptors_gpu.sif qm_descriptors_gpu.def
    start: sh scripts/serve_gpu_in_singularity.sh

commands:
  download: sh scripts/download_trained_models.sh
  stop-docker: docker stop qm_descriptors; docker rm qm_descriptors
  stop-singularity: singularity instance stop qm_descriptors
