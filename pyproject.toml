[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x-synth"
dynamic = ["version"]
description = "ASKCOS-based retrosynthesis orchestration and synthesis research workbench"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi==0.142.2",
    "starlette==1.3.1",
    "pydantic==2.12.4",
    "PyYAML==6.0.1",
    "rdkit==2026.3.1",
    "rdchiral==1.1.0",
    "networkx==3.6.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3", "httpx==0.28.1", "requests==2.34.2", "PyJWT[crypto]==2.15.1"]

[project.urls]
Repository = "https://github.com/Victor-Xu-1/X-Synth"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps", "apps.api*", "scripts.diagnostics*"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
