stock_sources:
  - name: compiled_commercial_stock
    type: compiled_stock
    path: data/compiled/commercial_stock/synon_stock.json
    consumers:
      - synon
      - route_closure
    exact_structure_required: true
    status: active
    notes: Unified exact-structure stock evidence compiled from existing ASKCOS commercial buyables.

  - name: compiled_domestic_stock
    type: compiled_stock
    path: data/compiled/domestic_stock/synon_stock.json
    consumers:
      - synon
      - route_closure
    exact_structure_required: true
    status: active
    notes: PubChem SourceName supplier import currently provides Aladdin, Ambeed, ChemScene, Combi-Blocks, Sigma-Aldrich, and TargetMol records.

  - name: compiled_unified_aizynth_stock
    type: compiled_stock
    path: data/compiled/unified_stock/aizynthfinder_stock_inchikeys.txt
    consumers:
      - aizynthfinder
      - route_search_terminal
    exact_structure_required: true
    status: active
    notes: Deduplicated exact-structure terminal set compiled from both ASKCOS commercial buyables and domestic supplier stock.

  - name: askcos_buyables_raw
    type: native_engine_stock
    path: apps/askcos-v2/askcos2_core/data/db/buyables
    consumers:
      - askcos
      - stock_compiler
    exact_structure_required: true
    status: active
    notes: Native ASKCOS buyables; managed centrally but not passed to Synon until compiled.

  - name: askcos_mongo_buyables
    type: internal
    consumers:
      - askcos
    exact_structure_required: true
    status: active

  - name: aizynthfinder_zinc_stock
    type: native_engine_stock
    path: engines/aizynthfinder/models/zinc_stock.hdf5
    consumers:
      - aizynthfinder
    exact_structure_required: true
    status: active
    notes: AiZynthFinder native HDF5 stock for its own terminal check.

  - name: aladdin
    type: supplier_source
    consumers:
      - domestic_stock_import
      - route_closure
    exact_structure_required: true
    status: active_via_pubchem_sourcename_import

  - name: ambeed
    type: supplier_source
    consumers:
      - domestic_stock_import
      - route_closure
    exact_structure_required: true
    status: active_via_pubchem_sourcename_import

  - name: chemscene
    type: supplier_source
    consumers:
      - domestic_stock_import
      - route_closure
    exact_structure_required: true
    status: active_via_pubchem_sourcename_import

  - name: combi_blocks
    type: supplier_source
    consumers:
      - domestic_stock_import
      - route_closure
    exact_structure_required: true
    status: active_via_pubchem_sourcename_import

  - name: sigma_aldrich
    type: supplier_source
    consumers:
      - domestic_stock_import
      - pubchem_suppliers
      - route_closure
    exact_structure_required: true
    status: active_via_pubchem_sourcename_import

  - name: targetmol
    type: supplier_source
    consumers:
      - domestic_stock_import
      - route_closure
    exact_structure_required: true
    status: active_via_pubchem_sourcename_import

  - name: chemspace
    type: supplier_source
    consumers:
      - askcos_buyables_raw
      - pubchem_suppliers
      - route_closure
    exact_structure_required: true
    status: active

  - name: chembridge
    type: supplier_source
    consumers:
      - askcos_buyables_raw
      - pubchem_suppliers
      - route_closure
    exact_structure_required: true
    status: active

  - name: mcule
    type: supplier_source
    consumers:
      - askcos_buyables_raw
      - route_closure
    exact_structure_required: true
    status: active

  - name: pubchem_suppliers
    type: online_supplier_resolver
    consumers:
      - synon
      - route_closure
    exact_structure_required: true
    status: optional_env_enabled
    accepted_evidence:
      - inchikey
      - exact_smiles
      - supplier_catalog_page
    notes: Enable with SYNON_ONLINE_SUPPLIERS=pubchem; rejected evidence is cached for audit.

  - name: user_stock
    type: local_inventory
    consumers:
      - synon
      - route_closure
    exact_structure_required: true
    status: optional

  - name: zinc
    type: public_stock
    consumers:
      - aizynthfinder
    exact_structure_required: true
    status: active

operator_import_sources:
  - name: supplier_export_files
    type: csv_tsv_json_jsonl
    path: data/sources
    consumers:
      - domestic_stock_import
    status: optional
    notes: Use only when a supplier or operator provides exact-structure export files. Unsupported web-only suppliers are not part of the runtime chain.

policy:
  weak_name_match_is_buyable: false
  similar_substructure_is_buyable: false
  accepted_closure_evidence:
    - exact_smiles
    - inchikey
    - cas
    - supplier_catalog_page
  native_engine_stock_must_be_compiled_for_synon_closure: true
