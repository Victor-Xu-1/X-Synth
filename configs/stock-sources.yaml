schema_version: 1
stock_sources:
  - name: commercial_catalog
    type: immutable_indexed_snapshot
    path_env: X_SYNTH_STOCK_INDEX
    consumers: [x_synth, askcos_v2, route_closure]
    exact_structure_required: true
    availability_basis: supplier_catalog_snapshot
policy:
  runtime_online_lookup: false
  runtime_json_overlay: false
  raw_imports_are_terminal_stock: false
  pubchem_cid_is_catalog_id: false
  unknown_price_is_zero: false
  search_and_review_use_same_snapshot: true
  accepted_evidence: [exact_structure, matched_supplier_catalog]
