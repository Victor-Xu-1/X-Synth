name: Source Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements/orchestrator-linux-py312.lock
      - run: python -m pip install --no-deps .
      - run: python -m pip check
      - name: Run related Python tests (fail on unmapped changes)
        run: python scripts/diagnostics/ci_scope.py --github-event "$GITHUB_EVENT_PATH" --suite python --run

  frontend:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Prepare product API dependencies only for selected contract tests
        working-directory: .
        run: |
          python scripts/diagnostics/ci_scope.py --github-event "$GITHUB_EVENT_PATH" --suite frontend > "$RUNNER_TEMP/frontend-scope.json"
          python - "$RUNNER_TEMP/frontend-scope.json" <<'PY'
          import json
          import subprocess
          import sys
          from scripts.diagnostics.ci_scope_profile import FRONTEND_API_TESTS
          with open(sys.argv[1], encoding="utf-8") as source:
              tests = set(json.load(source)["tests"])
          if tests & FRONTEND_API_TESTS:
              subprocess.run([sys.executable, "-m", "pip", "install", "--require-hashes",
                              "-r", "requirements/orchestrator-linux-py312.lock"], check=True)
              subprocess.run([sys.executable, "-m", "pip", "check"], check=True)
          PY
      - name: Run related frontend tests (exact paths, no full-suite fallback)
        working-directory: .
        run: python scripts/diagnostics/ci_scope.py --github-event "$GITHUB_EVENT_PATH" --suite frontend --run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  reaction-data:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select only related ORD import tests
        id: scope
        run: |
          python scripts/diagnostics/ci_scope.py --github-event "$GITHUB_EVENT_PATH" --suite reaction-data > "$RUNNER_TEMP/reaction-data-scope.json"
          python - "$RUNNER_TEMP/reaction-data-scope.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              selected = bool(json.load(source)["tests"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("selected=" + str(selected).lower() + "\n")
          PY
      - name: Install the isolated data-import environment
        if: steps.scope.outputs.selected == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/reaction-data-env"
          "$RUNNER_TEMP/reaction-data-env/bin/python" -m pip install --require-hashes -r requirements/reaction-data-linux-py312.lock
          "$RUNNER_TEMP/reaction-data-env/bin/python" -m pip check
      - name: Verify ORD ingestion without changing product dependencies
        if: steps.scope.outputs.selected == 'true'
        run: '"$RUNNER_TEMP/reaction-data-env/bin/python" scripts/diagnostics/ci_scope.py --github-event "$GITHUB_EVENT_PATH" --suite reaction-data --run'
